[pytest]
# Dónde están los tests, y desde dónde se importa `app`.
testpaths = tests
pythonpath = .

# openpyxl usa internamente datetime.utcnow(), que Python 3.12 marcó como
# obsoleto. No es nuestro código ni afecta al resultado: lo silenciamos solo
# para openpyxl, así cualquier otro aviso sigue apareciendo.
filterwarnings =
    ignore:datetime.datetime.utcnow:DeprecationWarning:openpyxl
